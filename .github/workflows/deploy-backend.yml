name: Deploy Backend to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'blog-backend/**'
      - '.github/workflows/deploy-backend.yml'
  pull_request:
    paths:
      - 'blog-backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    defaults:
      run:
        working-directory: ./blog-backend
        
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './blog-backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'blog-backend'
          command: deploy --minify src/index.ts
          secrets: |
            DATABASE_URL
            ALLOWED_ORIGIN
            DISCORD_WEBHOOK_URL
            DISCORD_SUBSCRIBE_WEBHOOK_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALLOWED_ORIGIN: ${{ secrets.ALLOWED_ORIGIN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_SUBSCRIBE_WEBHOOK_URL: ${{ secrets.DISCORD_SUBSCRIBE_WEBHOOK_URL }}
